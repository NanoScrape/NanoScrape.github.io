<!DOCTYPE html>
<html lang="en">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>Page not found — NanoScrape</title>
 <script>
 // Detect language from URL and redirect to that language's homepage
 var path = window.location.pathname;
 var langMatch = path.match(/\/(de|zh|fr)\//);
 var target = langMatch ? '/' + langMatch[1] + '/' : '/';
 window.location.replace(target);
 </script>
 <style>
 body { background: #080a10; color: #7a99ba; font-family: system-ui; text-align: center; padding: 80px 20px; }
 a { color: #0047ff; }
 </style>
</head>
<body>
 <p>Redirecting...</p>
 <p><a href="/">Go to NanoScrape homepage</a></p>
</body>
</html>
