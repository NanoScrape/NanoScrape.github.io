<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="100%" style="max-width:900px" role="img" aria-labelledby="cost-title cost-desc">
  <title id="cost-title">Job Scraper Cost Comparison</title>
  <desc id="cost-desc">Horizontal bar chart comparing cost per 1,000 jobs across NanoScrape scraper tiers. Career Site Jobs Scraper (ATS-native, Tier 1) is cheapest at $1. Country-specific boards average $5. Website Job Extractor HTTP and LLM (Tier 2) costs $4. Website Job Extractor Browser (Tier 3) costs $6. Global aggregators such as LinkedIn, Indeed, and Glassdoor cost approximately $8 per 1,000 jobs.</desc>
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="900" height="360" fill="#f8fafc" rx="12"/>

  <!-- Title -->
  <text x="450" y="32" text-anchor="middle" font-size="18" font-weight="700" fill="#1e293b">Cost per 1,000 Jobs by Scraper Type</text>
  <text x="450" y="52" text-anchor="middle" font-size="13" fill="#64748b">All NanoScrape actors use pay-per-event (PPE) - no monthly seats, no minimums</text>

  <!-- Axis -->
  <line x1="340" y1="72" x2="340" y2="310" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="340" y1="310" x2="870" y2="310" stroke="#94a3b8" stroke-width="1.5"/>

  <!-- X axis scale: max $8, chart width=530px, so $1=66.25px -->
  <!-- Grid lines at $2, $4, $6, $8 -->
  <line x1="472" y1="72" x2="472" y2="310" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="605" y1="72" x2="605" y2="310" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="737" y1="72" x2="737" y2="310" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="870" y1="72" x2="870" y2="310" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="472" y="322" text-anchor="middle" font-size="11" fill="#9ca3af">$2</text>
  <text x="605" y="322" text-anchor="middle" font-size="11" fill="#9ca3af">$4</text>
  <text x="737" y="322" text-anchor="middle" font-size="11" fill="#9ca3af">$6</text>
  <text x="870" y="322" text-anchor="middle" font-size="11" fill="#9ca3af">$8</text>
  <text x="340" y="322" text-anchor="middle" font-size="11" fill="#9ca3af">$0</text>

  <!-- X axis label -->
  <text x="605" y="344" text-anchor="middle" font-size="12" fill="#6b7280">Cost per 1,000 jobs (USD)</text>

  <!-- Row height: 44px, first bar at y=84 -->

  <!-- Row 1: Career Site Jobs Scraper Tier 1 - $1 - blue - bar width=66px -->
  <rect x="340" y="84" width="66" height="28" rx="4" fill="#0047ff"/>
  <text x="334" y="102" text-anchor="end" font-size="12" fill="#374151" font-weight="600">Career Site Jobs Scraper</text>
  <text x="334" y="116" text-anchor="end" font-size="11" fill="#6b7280">Tier 1 - ATS-native HTTP</text>
  <text x="413" y="102" font-size="13" font-weight="700" fill="#fff">$1</text>
  <text x="420" y="102" font-size="12" fill="#2563eb">/1K jobs</text>

  <!-- Row 2: Website Job Extractor HTTP+LLM Tier 2 - $4 - green - bar width=265px -->
  <rect x="340" y="136" width="265" height="28" rx="4" fill="#059669"/>
  <text x="334" y="154" text-anchor="end" font-size="12" fill="#374151" font-weight="600">Website Job Extractor (HTTP)</text>
  <text x="334" y="168" text-anchor="end" font-size="11" fill="#6b7280">Tier 2 - LLM extraction</text>
  <text x="612" y="154" font-size="13" font-weight="700" fill="#fff">$4</text>
  <text x="619" y="154" font-size="12" fill="#059669">/1K jobs</text>

  <!-- Row 3: Country-specific boards ~$5 - orange-ish green - bar width=331px -->
  <rect x="340" y="188" width="331" height="28" rx="4" fill="#2563eb"/>
  <text x="334" y="206" text-anchor="end" font-size="12" fill="#374151" font-weight="600">Country-specific job boards</text>
  <text x="334" y="220" text-anchor="end" font-size="11" fill="#6b7280">Totaljobs, Karriere.at, SEPE, etc.</text>
  <text x="678" y="206" font-size="13" font-weight="700" fill="#fff">~$5</text>
  <text x="700" y="206" font-size="12" fill="#1d4ed8">/1K jobs</text>

  <!-- Row 4: Website Job Extractor Browser Tier 3 - $6 - orange - bar width=397px -->
  <rect x="340" y="240" width="397" height="28" rx="4" fill="#d97706"/>
  <text x="334" y="258" text-anchor="end" font-size="12" fill="#374151" font-weight="600">Website Job Extractor (Browser)</text>
  <text x="334" y="272" text-anchor="end" font-size="11" fill="#6b7280">Tier 3 - JS-rendered pages</text>
  <text x="744" y="258" font-size="13" font-weight="700" fill="#fff">$6</text>
  <text x="751" y="258" font-size="12" fill="#b45309">/1K jobs</text>

  <!-- Row 5: Global aggregators ~$8 - red - bar width=530px (full width) -->
  <rect x="340" y="272" width="530" height="28" rx="4" fill="#dc2626"/>
  <text x="334" y="290" text-anchor="end" font-size="12" fill="#374151" font-weight="600">Global aggregators</text>
  <text x="334" y="304" text-anchor="end" font-size="11" fill="#6b7280">LinkedIn, Indeed, Glassdoor</text>
  <text x="877" y="290" font-size="13" font-weight="700" fill="#fff">~$8</text>
  <!-- The $8 label is at edge so put it inside -->
  <text x="820" y="290" font-size="13" font-weight="700" fill="#fff">~$8 /1K jobs</text>
</svg>
