<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="100%" style="max-width:900px" role="img" aria-labelledby="pyramid-title pyramid-desc">
  <title id="pyramid-title">Global Job Market Tier Pyramid</title>
  <desc id="pyramid-desc">A pyramid showing five tiers of job platforms by count and employer spend share. Tier 0 at the top: 40 to 60 global aggregators at roughly 40 percent of spend. Tier 1: 500 to 800 national leaders at roughly 45 percent. Tier 2: 3,000 to 6,000 niche boards at roughly 12 percent. Tier 3: 30,000 to 80,000 long-tail boards at roughly 3 percent. Tier 4: 200,000 plus any listings page at under 1 percent.</desc>
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="900" height="520" fill="#f8fafc" rx="12"/>

  <!-- Title -->
  <text x="450" y="36" text-anchor="middle" font-size="18" font-weight="700" fill="#1e293b">Global Job Market: The 5-Tier Pyramid</text>

  <!-- Pyramid rows - centered horizontally at x=450, pyramid grows downward -->
  <!-- Tier 0 - top, narrowest -->
  <polygon points="450,70 330,130 570,130" fill="#0047ff" opacity="0.9"/>
  <text x="450" y="108" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">Tier 0</text>

  <!-- Tier 1 -->
  <polygon points="330,134 570,134 610,194 290,194" fill="#2563eb" opacity="0.85"/>
  <text x="450" y="170" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">Tier 1</text>

  <!-- Tier 2 -->
  <polygon points="290,198 610,198 650,258 250,258" fill="#059669" opacity="0.85"/>
  <text x="450" y="234" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">Tier 2</text>

  <!-- Tier 3 -->
  <polygon points="250,262 650,262 695,322 205,322" fill="#d97706" opacity="0.85"/>
  <text x="450" y="298" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">Tier 3</text>

  <!-- Tier 4 - bottom, widest -->
  <polygon points="205,326 695,326 760,390 140,390" fill="#dc2626" opacity="0.8"/>
  <text x="450" y="364" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">Tier 4</text>

  <!-- Left labels: count -->
  <text x="70" y="104" text-anchor="middle" font-size="12" fill="#374151" font-weight="600">40-60</text>
  <text x="70" y="118" text-anchor="middle" font-size="11" fill="#6b7280">platforms</text>
  <line x1="140" y1="108" x2="325" y2="108" stroke="#9ca3af" stroke-width="1" stroke-dasharray="3,3"/>

  <text x="70" y="168" text-anchor="middle" font-size="12" fill="#374151" font-weight="600">500-800</text>
  <text x="70" y="182" text-anchor="middle" font-size="11" fill="#6b7280">platforms</text>
  <line x1="140" y1="172" x2="285" y2="172" stroke="#9ca3af" stroke-width="1" stroke-dasharray="3,3"/>

  <text x="70" y="232" text-anchor="middle" font-size="12" fill="#374151" font-weight="600">3K-6K</text>
  <text x="70" y="246" text-anchor="middle" font-size="11" fill="#6b7280">platforms</text>
  <line x1="140" y1="236" x2="245" y2="236" stroke="#9ca3af" stroke-width="1" stroke-dasharray="3,3"/>

  <text x="70" y="296" text-anchor="middle" font-size="12" fill="#374151" font-weight="600">30K-80K</text>
  <text x="70" y="310" text-anchor="middle" font-size="11" fill="#6b7280">platforms</text>
  <line x1="140" y1="300" x2="200" y2="300" stroke="#9ca3af" stroke-width="1" stroke-dasharray="3,3"/>

  <text x="70" y="360" text-anchor="middle" font-size="12" fill="#374151" font-weight="600">200K+</text>
  <text x="70" y="374" text-anchor="middle" font-size="11" fill="#6b7280">platforms</text>
  <line x1="140" y1="364" x2="136" y2="364" stroke="#9ca3af" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- Right labels: employer spend share -->
  <text x="830" y="104" text-anchor="middle" font-size="12" fill="#0047ff" font-weight="700">~40%</text>
  <text x="830" y="118" text-anchor="middle" font-size="11" fill="#6b7280">of spend</text>
  <line x1="760" y1="108" x2="574" y2="108" stroke="#9ca3af" stroke-width="1" stroke-dasharray="3,3"/>

  <text x="830" y="168" text-anchor="middle" font-size="12" fill="#2563eb" font-weight="700">~45%</text>
  <text x="830" y="182" text-anchor="middle" font-size="11" fill="#6b7280">of spend</text>
  <line x1="760" y1="172" x2="614" y2="172" stroke="#9ca3af" stroke-width="1" stroke-dasharray="3,3"/>

  <text x="830" y="232" text-anchor="middle" font-size="12" fill="#059669" font-weight="700">~12%</text>
  <text x="830" y="246" text-anchor="middle" font-size="11" fill="#6b7280">of spend</text>
  <line x1="760" y1="236" x2="654" y2="236" stroke="#9ca3af" stroke-width="1" stroke-dasharray="3,3"/>

  <text x="830" y="296" text-anchor="middle" font-size="12" fill="#d97706" font-weight="700">~3%</text>
  <text x="830" y="310" text-anchor="middle" font-size="11" fill="#6b7280">of spend</text>
  <line x1="760" y1="300" x2="698" y2="300" stroke="#9ca3af" stroke-width="1" stroke-dasharray="3,3"/>

  <text x="830" y="360" text-anchor="middle" font-size="12" fill="#dc2626" font-weight="700">&lt;1%</text>
  <text x="830" y="374" text-anchor="middle" font-size="11" fill="#6b7280">of spend</text>
  <line x1="760" y1="364" x2="764" y2="364" stroke="#9ca3af" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- Tier description labels -->
  <text x="450" y="430" text-anchor="middle" font-size="12" fill="#374151">
    <tspan x="180" dy="0" font-weight="600">Tier 0:</tspan>
    <tspan> Global aggregators (Indeed, LinkedIn, Seek...)</tspan>
  </text>
  <text x="450" y="448" text-anchor="middle" font-size="12" fill="#374151">
    <tspan x="180" dy="0" font-weight="600">Tier 1:</tspan>
    <tspan> National generalist leaders (Pracuj.pl, Jobindex.dk...)</tspan>
  </text>
  <text x="450" y="466" text-anchor="middle" font-size="12" fill="#374151">
    <tspan x="180" dy="0" font-weight="600">Tier 2:</tspan>
    <tspan> Niche/vertical boards (BuiltIn, CharityJob, Dice...)</tspan>
  </text>
  <text x="450" y="484" text-anchor="middle" font-size="12" fill="#374151">
    <tspan x="180" dy="0" font-weight="600">Tier 3:</tspan>
    <tspan> Long-tail city, university, association boards</tspan>
  </text>
  <text x="450" y="502" text-anchor="middle" font-size="12" fill="#374151">
    <tspan x="180" dy="0" font-weight="600">Tier 4:</tspan>
    <tspan> Any page with a listings widget (mostly abandoned)</tspan>
  </text>

  <!-- Note box -->
  <rect x="200" y="406" width="500" height="22" fill="#eff6ff" rx="4" stroke="#bfdbfe" stroke-width="1"/>
  <text x="450" y="421" text-anchor="middle" font-size="12" fill="#1e40af" font-weight="600">Our catalog covers Tier 0 + 1 + slice of Tier 2 = 85%+ of employer spend</text>
</svg>
