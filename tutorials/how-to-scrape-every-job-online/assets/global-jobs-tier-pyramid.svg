<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" width="100%" style="max-width:900px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" role="img" aria-labelledby="pyramid-title pyramid-desc">
<title id="pyramid-title">The global jobs market tier pyramid</title>
<desc id="pyramid-desc">Five-tier pyramid showing platform counts (left) and share of total employer spend (right) for the global online jobs market. Tier 0 global aggregators are 40-60 platforms and ~40 percent of spend; Tier 1 national leaders are 500-800 platforms and ~45 percent of spend; Tier 2 niche and vertical boards are 3,000-6,000 platforms and ~12 percent of spend; Tier 3 long-tail city, association and university boards are 30,000-80,000 platforms and about 3 percent of spend; Tier 4 anything with a listings page is 200,000-plus platforms and under 1 percent of spend. The NanoScrape catalog covers all of Tier 0 and 1 plus a slice of Tier 2, which is roughly 85 percent of total employer spend.</desc>
<rect width="900" height="620" fill="#fafafa" rx="8"/>

<!-- Title -->
<text x="450" y="34" font-size="18" font-weight="700" fill="#1a1a1a" text-anchor="middle">The global jobs market tier pyramid</text>
<text x="450" y="54" font-size="12" fill="#666" text-anchor="middle">Platform count (left) vs. share of employer spend (right)</text>

<!-- Axis labels -->
<text x="150" y="80" font-size="11" font-weight="600" fill="#4b5563">PLATFORMS</text>
<text x="750" y="80" font-size="11" font-weight="600" fill="#4b5563" text-anchor="end">EMPLOYER SPEND</text>

<!-- TIER 0 (top of pyramid, smallest count, high spend %) -->
<polygon points="410,95 490,95 500,135 400,135" fill="#0047ff" opacity="0.9"/>
<text x="450" y="120" font-size="12" font-weight="700" fill="white" text-anchor="middle">Tier 0</text>
<text x="150" y="122" font-size="12" fill="#1e3a8a">40-60 global aggregators (Indeed, LinkedIn, Seek, Naukri...)</text>
<text x="750" y="122" font-size="14" font-weight="700" fill="#0047ff" text-anchor="end">~40%</text>

<!-- TIER 1 -->
<polygon points="400,140 500,140 515,190 385,190" fill="#2563eb" opacity="0.85"/>
<text x="450" y="170" font-size="12" font-weight="700" fill="white" text-anchor="middle">Tier 1</text>
<text x="150" y="172" font-size="12" fill="#1e40af">500-800 national leaders (Pracuj.pl, Jobindex.dk, HH.ru...)</text>
<text x="750" y="172" font-size="14" font-weight="700" fill="#2563eb" text-anchor="end">~45%</text>

<!-- TIER 2 -->
<polygon points="385,195 515,195 540,250 360,250" fill="#059669" opacity="0.85"/>
<text x="450" y="228" font-size="12" font-weight="700" fill="white" text-anchor="middle">Tier 2</text>
<text x="150" y="230" font-size="12" fill="#064e3b">3,000-6,000 niche/vertical (Dice, BuiltIn, HealtheCareers...)</text>
<text x="750" y="230" font-size="14" font-weight="700" fill="#059669" text-anchor="end">~12%</text>

<!-- TIER 3 -->
<polygon points="360,255 540,255 580,320 320,320" fill="#d97706" opacity="0.85"/>
<text x="450" y="292" font-size="12" font-weight="700" fill="white" text-anchor="middle">Tier 3</text>
<text x="150" y="294" font-size="12" fill="#7c2d12">30,000-80,000 long-tail (city, university, association boards)</text>
<text x="750" y="294" font-size="14" font-weight="700" fill="#d97706" text-anchor="end">~3%</text>

<!-- TIER 4 (base, largest count, tiny spend %) -->
<polygon points="320,325 580,325 630,405 270,405" fill="#dc2626" opacity="0.85"/>
<text x="450" y="368" font-size="12" font-weight="700" fill="white" text-anchor="middle">Tier 4</text>
<text x="150" y="370" font-size="12" fill="#7f1d1d">200,000+ any listings page (mostly abandoned WP installs)</text>
<text x="750" y="370" font-size="14" font-weight="700" fill="#dc2626" text-anchor="end">&lt;1%</text>

<!-- Coverage callout at the BOTTOM (not overlaying legend) -->
<rect x="120" y="440" width="660" height="70" fill="#dbeafe" stroke="#2563eb" stroke-width="2" rx="8"/>
<text x="450" y="463" font-size="13" font-weight="700" fill="#1e3a8a" text-anchor="middle">The NanoScrape catalog: all of Tier 0 and 1, plus a meaningful slice of Tier 2</text>
<text x="450" y="483" font-size="12" fill="#1e40af" text-anchor="middle">= about 85% of total employer spend, with 86+ maintained job scrapers across 29 countries.</text>
<text x="450" y="501" font-size="11" fill="#3730a3" text-anchor="middle">Tier 3 and Tier 4 have diminishing marginal utility unless the source is a supported ATS (multiplier effect).</text>

<!-- ATS aside — moved to bottom right, out of way of pyramid -->
<rect x="580" y="530" width="300" height="70" fill="#f5f5f5" stroke="#9ca3af" stroke-width="1" rx="6"/>
<text x="730" y="551" font-size="11" font-weight="700" fill="#374151" text-anchor="middle">On a different axis: 200-400 ATS vendors</text>
<text x="730" y="569" font-size="10" fill="#4b5563" text-anchor="middle">Top 30 ATS platforms sit in front of well over</text>
<text x="730" y="585" font-size="10" fill="#4b5563" text-anchor="middle">1 million employer career pages combined.</text>

<!-- Legend at BOTTOM LEFT — clear of coverage box -->
<rect x="20" y="530" width="230" height="70" fill="white" stroke="#e5e7eb" stroke-width="1" rx="6"/>
<text x="30" y="547" font-size="10.5" font-weight="700" fill="#4b5563">TIER LEGEND</text>
<rect x="30" y="554" width="10" height="10" fill="#0047ff"/>
<text x="46" y="563" font-size="9.5" fill="#333">Tier 0: Aggregators</text>
<rect x="130" y="554" width="10" height="10" fill="#2563eb"/>
<text x="146" y="563" font-size="9.5" fill="#333">Tier 1: National</text>
<rect x="30" y="570" width="10" height="10" fill="#059669"/>
<text x="46" y="579" font-size="9.5" fill="#333">Tier 2: Niche</text>
<rect x="130" y="570" width="10" height="10" fill="#d97706"/>
<text x="146" y="579" font-size="9.5" fill="#333">Tier 3: Long-tail</text>
<rect x="30" y="586" width="10" height="10" fill="#dc2626"/>
<text x="46" y="595" font-size="9.5" fill="#333">Tier 4: Any listings</text>
</svg>
