<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="100%" style="max-width:900px" role="img" aria-labelledby="map-title map-desc">
  <title id="map-title">NanoScrape Job Scrapers World Coverage Map</title>
  <desc id="map-desc">A bar chart grouped by region showing NanoScrape job scraper coverage across 29 countries. Switzerland leads with 14 actors, followed by United Kingdom at 12, United States at 9, Germany at 7, Austria at 4. Multiple countries have 1 to 2 actors including Canada, Ireland, France, Spain, Italy, Netherlands, Denmark, Sweden, Norway, Finland, Poland, Czech Republic, Romania, Ukraine, Russia, and global multi-country actors at 18.</desc>
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="900" height="500" fill="#f8fafc" rx="12"/>

  <!-- Title -->
  <text x="450" y="32" text-anchor="middle" font-size="18" font-weight="700" fill="#1e293b">NanoScrape Job Scraper Coverage by Country</text>
  <text x="450" y="52" text-anchor="middle" font-size="13" fill="#64748b">104+ actors across 29 countries and global platforms</text>

  <!-- Legend -->
  <rect x="540" y="68" width="16" height="16" rx="3" fill="#0047ff"/>
  <text x="562" y="81" font-size="12" fill="#374151">5+ actors (deep coverage)</text>
  <rect x="700" y="68" width="16" height="16" rx="3" fill="#059669"/>
  <text x="722" y="81" font-size="12" fill="#374151">2-4 actors</text>
  <rect x="790" y="68" width="16" height="16" rx="3" fill="#93c5fd"/>
  <text x="812" y="81" font-size="12" fill="#374151">1 actor</text>

  <!-- Horizontal bar chart -->
  <!-- Y axis label -->
  <text x="12" y="108" font-size="11" fill="#6b7280" font-weight="600">Country</text>
  <text x="870" y="108" text-anchor="end" font-size="11" fill="#6b7280" font-weight="600">Actors</text>

  <!-- Scale marks at top -->
  <line x1="200" y1="112" x2="860" y2="112" stroke="#e2e8f0" stroke-width="1"/>
  <!-- Scale: max=18 global, chart width=660px, so 1 actor = 36.67px -->
  <!-- Grid lines at 5, 10, 15 -->
  <line x1="383" y1="112" x2="383" y2="460" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="567" y1="112" x2="567" y2="460" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="750" y1="112" x2="750" y2="460" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="383" y="108" text-anchor="middle" font-size="10" fill="#9ca3af">5</text>
  <text x="567" y="108" text-anchor="middle" font-size="10" fill="#9ca3af">10</text>
  <text x="750" y="108" text-anchor="middle" font-size="10" fill="#9ca3af">15</text>

  <!-- Bars: x_start=200, bar_height=18, gap=4, row_height=22, scale=36.67 per actor -->
  <!-- Switzerland: 14 actors -> 513px -->
  <rect x="200" y="118" width="513" height="18" rx="3" fill="#0047ff"/>
  <text x="194" y="131" text-anchor="end" font-size="12" fill="#374151" font-weight="500">Switzerland</text>
  <text x="720" y="131" font-size="12" fill="#fff" font-weight="700">14</text>

  <!-- United Kingdom: 12 -> 440px -->
  <rect x="200" y="140" width="440" height="18" rx="3" fill="#0047ff"/>
  <text x="194" y="153" text-anchor="end" font-size="12" fill="#374151" font-weight="500">United Kingdom</text>
  <text x="647" y="153" font-size="12" fill="#fff" font-weight="700">12</text>

  <!-- Global (multi-country): 18 -> 660px -->
  <rect x="200" y="162" width="660" height="18" rx="3" fill="#0047ff"/>
  <text x="194" y="175" text-anchor="end" font-size="12" fill="#374151" font-weight="500">Global actors</text>
  <text x="867" y="175" font-size="12" fill="#374151" font-weight="700">18</text>

  <!-- United States: 9 -> 330px -->
  <rect x="200" y="184" width="330" height="18" rx="3" fill="#0047ff"/>
  <text x="194" y="197" text-anchor="end" font-size="12" fill="#374151" font-weight="500">United States</text>
  <text x="537" y="197" font-size="12" fill="#fff" font-weight="700">9</text>

  <!-- Germany: 7 -> 257px -->
  <rect x="200" y="206" width="257" height="18" rx="3" fill="#0047ff"/>
  <text x="194" y="219" text-anchor="end" font-size="12" fill="#374151" font-weight="500">Germany</text>
  <text x="464" y="219" font-size="12" fill="#fff" font-weight="700">7</text>

  <!-- Austria: 4 -> 147px -->
  <rect x="200" y="228" width="147" height="18" rx="3" fill="#059669"/>
  <text x="194" y="241" text-anchor="end" font-size="12" fill="#374151" font-weight="500">Austria</text>
  <text x="354" y="241" font-size="12" fill="#fff" font-weight="700">4</text>

  <!-- Denmark: 2 -> 73px -->
  <rect x="200" y="250" width="73" height="18" rx="3" fill="#059669"/>
  <text x="194" y="263" text-anchor="end" font-size="12" fill="#374151" font-weight="500">Denmark</text>
  <text x="280" y="263" font-size="12" fill="#fff" font-weight="700">2</text>

  <!-- France: 2 -> 73px -->
  <rect x="200" y="272" width="73" height="18" rx="3" fill="#059669"/>
  <text x="194" y="285" text-anchor="end" font-size="12" fill="#374151" font-weight="500">France</text>
  <text x="280" y="285" font-size="12" fill="#fff" font-weight="700">2</text>

  <!-- Italy: 2 -> 73px -->
  <rect x="200" y="294" width="73" height="18" rx="3" fill="#059669"/>
  <text x="194" y="307" text-anchor="end" font-size="12" fill="#374151" font-weight="500">Italy</text>
  <text x="280" y="307" font-size="12" fill="#fff" font-weight="700">2</text>

  <!-- Poland: 2 -> 73px -->
  <rect x="200" y="316" width="73" height="18" rx="3" fill="#059669"/>
  <text x="194" y="329" text-anchor="end" font-size="12" fill="#374151" font-weight="500">Poland</text>
  <text x="280" y="329" font-size="12" fill="#fff" font-weight="700">2</text>

  <!-- Russia: 2 -> 73px -->
  <rect x="200" y="338" width="73" height="18" rx="3" fill="#059669"/>
  <text x="194" y="351" text-anchor="end" font-size="12" fill="#374151" font-weight="500">Russia</text>
  <text x="280" y="351" font-size="12" fill="#fff" font-weight="700">2</text>

  <!-- Sweden: 2 -> 73px -->
  <rect x="200" y="360" width="73" height="18" rx="3" fill="#059669"/>
  <text x="194" y="373" text-anchor="end" font-size="12" fill="#374151" font-weight="500">Sweden</text>
  <text x="280" y="373" font-size="12" fill="#fff" font-weight="700">2</text>

  <!-- Ukraine: 2 -> 73px -->
  <rect x="200" y="382" width="73" height="18" rx="3" fill="#059669"/>
  <text x="194" y="395" text-anchor="end" font-size="12" fill="#374151" font-weight="500">Ukraine</text>
  <text x="280" y="395" font-size="12" fill="#fff" font-weight="700">2</text>

  <!-- Single-actor countries: Canada, Ireland, Spain, Netherlands, Norway, Finland, Czech Republic, Romania -->
  <!-- Canada: 1 -> 37px -->
  <rect x="200" y="404" width="37" height="18" rx="3" fill="#93c5fd"/>
  <text x="194" y="417" text-anchor="end" font-size="12" fill="#374151" font-weight="500">Canada +7 more</text>
  <text x="244" y="417" font-size="12" fill="#1e3a8a" font-weight="700">1 each</text>

  <!-- Axis line -->
  <line x1="200" y1="112" x2="200" y2="428" stroke="#94a3b8" stroke-width="1.5"/>

  <!-- Source note -->
  <text x="450" y="470" text-anchor="middle" font-size="11" fill="#94a3b8">+7 single-actor countries: Ireland, Spain, Netherlands, Norway, Finland, Czech Republic, Romania</text>
  <text x="450" y="488" text-anchor="middle" font-size="11" fill="#94a3b8">Source: NanoScrape published actor catalog, September 2026</text>
</svg>
