<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="100%" style="max-width:900px" role="img" aria-labelledby="dtree-title dtree-desc">
  <title id="dtree-title">Which Scraper Decision Tree</title>
  <desc id="dtree-desc">A decision tree starting with the question "What are you scraping?" branching into four paths. Branch 1: Known platform such as LinkedIn or Glassdoor leads to the catalog below. Branch 2: Company careers page on a supported ATS leads to Career Site Jobs Scraper at one dollar per one thousand jobs. Branch 3: Any careers page with unknown ATS leads to Website Job Extractor with LLM auto-detection. Branch 4: Multi-source unified feed leads to Job Feed orchestrator in private beta.</desc>
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="900" height="440" fill="#f8fafc" rx="12"/>

  <!-- Title -->
  <text x="450" y="32" text-anchor="middle" font-size="18" font-weight="700" fill="#1e293b">Which Scraper Should I Use?</text>

  <!-- Root question box -->
  <rect x="300" y="52" width="300" height="52" rx="10" fill="#0047ff" stroke="#003acc" stroke-width="2"/>
  <text x="450" y="74" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">What are you scraping?</text>
  <text x="450" y="92" text-anchor="middle" font-size="12" fill="#bfdbfe">Choose the path that matches your goal</text>

  <!-- Connector lines from root to branches -->
  <!-- Branch 1: far left -->
  <line x1="300" y1="78" x2="100" y2="78" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="100" y1="78" x2="100" y2="178" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Branch 2: center-left -->
  <line x1="380" y1="104" x2="280" y2="178" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Branch 3: center-right -->
  <line x1="520" y1="104" x2="620" y2="178" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Branch 4: far right -->
  <line x1="600" y1="78" x2="800" y2="78" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="800" y1="78" x2="800" y2="178" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Branch 1 box: Known platform -->
  <rect x="20" y="180" width="160" height="72" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="100" y="204" text-anchor="middle" font-size="12" font-weight="700" fill="#1e40af">Known platform</text>
  <text x="100" y="220" text-anchor="middle" font-size="11" fill="#374151">LinkedIn, Glassdoor,</text>
  <text x="100" y="234" text-anchor="middle" font-size="11" fill="#374151">Indeed, Seek...</text>

  <!-- Branch 2 box: Supported ATS careers page -->
  <rect x="200" y="180" width="160" height="72" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="280" y="204" text-anchor="middle" font-size="12" font-weight="700" fill="#065f46">Supported ATS</text>
  <text x="280" y="220" text-anchor="middle" font-size="11" fill="#374151">Workday, Greenhouse,</text>
  <text x="280" y="234" text-anchor="middle" font-size="11" fill="#374151">iCIMS, Phenom...</text>

  <!-- Branch 3 box: Any careers page -->
  <rect x="540" y="180" width="160" height="72" rx="8" fill="#fefce8" stroke="#d97706" stroke-width="2"/>
  <text x="620" y="204" text-anchor="middle" font-size="12" font-weight="700" fill="#92400e">Any careers page</text>
  <text x="620" y="220" text-anchor="middle" font-size="11" fill="#374151">Unknown ATS or</text>
  <text x="620" y="234" text-anchor="middle" font-size="11" fill="#374151">custom-built site</text>

  <!-- Branch 4 box: Multi-source feed -->
  <rect x="720" y="180" width="160" height="72" rx="8" fill="#fff7ed" stroke="#dc2626" stroke-width="2"/>
  <text x="800" y="204" text-anchor="middle" font-size="12" font-weight="700" fill="#991b1b">Multi-source feed</text>
  <text x="800" y="220" text-anchor="middle" font-size="11" fill="#374151">Many sources,</text>
  <text x="800" y="234" text-anchor="middle" font-size="11" fill="#374151">unified output</text>

  <!-- Down arrows -->
  <line x1="100" y1="252" x2="100" y2="292" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="280" y1="252" x2="280" y2="292" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="620" y1="252" x2="620" y2="292" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="800" y1="252" x2="800" y2="292" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Result boxes -->
  <!-- Branch 1 result -->
  <rect x="20" y="294" width="160" height="80" rx="8" fill="#2563eb"/>
  <text x="100" y="318" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">Catalog below</text>
  <text x="100" y="334" text-anchor="middle" font-size="11" fill="#bfdbfe">104+ actors listed</text>
  <text x="100" y="350" text-anchor="middle" font-size="11" fill="#bfdbfe">by country/vertical</text>
  <text x="100" y="366" text-anchor="middle" font-size="10" fill="#93c5fd">click an actor link</text>

  <!-- Branch 2 result -->
  <rect x="200" y="294" width="160" height="80" rx="8" fill="#059669"/>
  <text x="280" y="316" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">Career Site Jobs</text>
  <text x="280" y="332" text-anchor="middle" font-size="11" fill="#fff">Scraper</text>
  <text x="280" y="350" text-anchor="middle" font-size="11" fill="#a7f3d0">24+ ATS platforms</text>
  <text x="280" y="366" text-anchor="middle" font-size="10" fill="#6ee7b7">$1 / 1,000 jobs</text>

  <!-- Branch 3 result -->
  <rect x="540" y="294" width="160" height="80" rx="8" fill="#d97706"/>
  <text x="620" y="316" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">Website Job</text>
  <text x="620" y="332" text-anchor="middle" font-size="11" fill="#fff">Extractor</text>
  <text x="620" y="350" text-anchor="middle" font-size="11" fill="#fef3c7">LLM auto-detection</text>
  <text x="620" y="366" text-anchor="middle" font-size="10" fill="#fde68a">$4-6 / 1,000 jobs</text>

  <!-- Branch 4 result -->
  <rect x="720" y="294" width="160" height="80" rx="8" fill="#dc2626"/>
  <text x="800" y="316" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">Job Feed</text>
  <text x="800" y="332" text-anchor="middle" font-size="11" fill="#fff">orchestrator</text>
  <text x="800" y="350" text-anchor="middle" font-size="11" fill="#fecaca">Routes, dedupes,</text>
  <text x="800" y="366" text-anchor="middle" font-size="10" fill="#fca5a5">unifies schema</text>

  <!-- Footer note -->
  <rect x="200" y="396" width="500" height="26" fill="#f1f5f9" rx="4" stroke="#e2e8f0" stroke-width="1"/>
  <text x="450" y="413" text-anchor="middle" font-size="12" fill="#475569">Not sure which ATS your target uses? Start with Website Job Extractor - it auto-detects and upgrades</text>
</svg>
